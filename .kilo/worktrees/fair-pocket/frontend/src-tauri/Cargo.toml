[package]
name = "classroomflare"
version = "1.0.0"
description = "ClassroomFlare - Adobe Connect Alternative for Windows"
authors = ["ClassroomFlare Team"]
edition = "2021"

[lib]
name = "classroomflare_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
