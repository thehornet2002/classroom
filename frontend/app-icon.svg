<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Monitor Display / Whiteboard Screen -->
  <rect x="144" y="160" width="736" height="500" rx="36" fill="url(#screen)" filter="url(#shadow)" stroke="#38bdf8" stroke-width="8"/>

  <!-- Inside Screen Content: Pods UI Layout -->
  <!-- Left Main Share Pod -->
  <rect x="176" y="196" width="460" height="428" rx="20" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <!-- Whiteboard drawing symbol -->
  <path d="M260 480 Q 340 320, 420 440 T 580 340" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round"/>
  <circle cx="580" cy="340" r="16" fill="#38bdf8"/>

  <!-- Right Upper Camera Pod -->
  <rect x="656" y="196" width="192" height="180" rx="16" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <!-- Video camera / Presenter Avatar -->
  <circle cx="752" cy="260" r="36" fill="#60a5fa"/>
  <path d="M700 340 Q 752 300, 804 340" fill="none" stroke="#60a5fa" stroke-width="12" stroke-linecap="round"/>

  <!-- Right Lower Attendees Pod -->
  <rect x="656" y="396" width="192" height="228" rx="16" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <circle cx="700" cy="444" r="16" fill="#10b981"/>
  <rect x="730" y="436" width="90" height="16" rx="8" fill="#64748b"/>
  <circle cx="700" cy="496" r="16" fill="#38bdf8"/>
  <rect x="730" y="488" width="80" height="16" rx="8" fill="#64748b"/>
  <circle cx="700" cy="548" r="16" fill="#a855f7"/>
  <rect x="730" y="540" width="70" height="16" rx="8" fill="#64748b"/>

  <!-- Stand & Base -->
  <path d="M464 660 L 560 660 L 580 780 L 444 780 Z" fill="#cbd5e1" filter="url(#shadow)"/>
  <rect x="360" y="780" width="304" height="40" rx="20" fill="#94a3b8" filter="url(#shadow)"/>
</svg>
